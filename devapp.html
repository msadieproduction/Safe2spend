<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173C35"><title>Safe2Spend Dev</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7f5}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="stage" src="mvp16.html" title="Safe2Spend"></iframe><script>
const stage=document.getElementById('stage');
function installZeroState(){
 const outer=stage.contentDocument, innerFrame=outer&&outer.getElementById('app');
 if(!innerFrame)return setTimeout(installZeroState,80);
 const d=innerFrame.contentDocument;
 if(!d||!d.body)return setTimeout(installZeroState,80);
 if(d.getElementById('zeroStateQaPatch'))return;
 const style=d.createElement('style');style.id='zeroStateQaPatch';style.textContent=`
.zero-preview{display:none;margin-top:16px;padding:15px;border-radius:20px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);cursor:pointer}.zero-preview.show{display:block}.zero-preview-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:900;letter-spacing:.09em;color:#dff4ea}.zero-preview-main{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:9px}.zero-preview-main small{display:block;color:#e5f6ee}.zero-preview-main strong{display:block;color:#fff;font-size:23px;margin-top:2px}.zero-preview-main .projected{text-align:right}.zero-preview-main .projected strong{font-size:27px}.between-copy{display:none}.between-copy.show{display:block;margin-top:14px;color:#effaf5;font-size:16px;line-height:1.45}.between-pill{display:none}.between-pill.show{display:inline-flex;margin-top:8px;align-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 11px;font-size:13px;font-weight:850}.until-payday{display:none;background:linear-gradient(145deg,#effaf5,#fbfffd);border-color:#cfe9dc}.until-payday.show{display:block}.until-payday h3{margin:0 0 7px;font-size:17px}.until-payday p{margin:0;color:#4f7064;line-height:1.5;font-size:14px}.until-payday .primary{margin-top:13px}.need-result{display:none;margin-top:14px}.need-result.show{display:block}.need-option{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff;margin-top:10px}.need-option.good{background:linear-gradient(145deg,#effaf5,#fbfffd);border-color:#cae7d8}.need-option h3{margin:0 0 6px}.need-impact{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:12px 0;padding:12px;border-radius:15px;background:#f4faf7}.need-impact>div:last-child{text-align:right}.need-checks{display:grid;gap:7px;font-size:13px;color:#4b6c60}.need-checks span:before{content:'✓';display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#23976d;color:#fff;font-weight:900;margin-right:7px}@media(max-width:410px){.zero-preview-main strong{font-size:20px}.zero-preview-main .projected strong{font-size:23px}}
`;d.head.appendChild(style);
 const hero=d.querySelector('#home .s2s-bubble');
 if(!hero)return setTimeout(installZeroState,80);
 const amount=d.getElementById('currentS2S'), normalCopy=hero.querySelector('.sub'), pace=d.getElementById('currentS2SSub');
 amount.insertAdjacentHTML('afterend','<div id="betweenPill" class="between-pill"></div>');
 normalCopy.id='normalHeroCopy';normalCopy.insertAdjacentHTML('afterend','<div id="betweenCopy" class="between-copy"></div>');
 pace.insertAdjacentHTML('afterend','<div id="zeroPreview" class="zero-preview" onclick="openZeroPaycheckPreview()"><div class="zero-preview-top"><span id="zeroPreviewWhen">NEXT PAYCHECK</span><span>›</span></div><div class="zero-preview-main"><div><small id="zeroPreviewIncome">$0</small><strong>Expected</strong></div><div class="projected"><small>PROJECTED SAFE2SPEND</small><strong id="zeroPreviewSafe">$0</strong></div></div></div>');
 hero.insertAdjacentHTML('afterend','<div id="untilPaydayCard" class="card until-payday"><h3>Until payday</h3><p id="untilPaydayCopy"></p><button class="primary full" onclick="openNeedSpend()">I need to spend before payday →</button></div>');
 d.body.insertAdjacentHTML('beforeend','<div id="needSpendM" class="modal"><div class="sheet"><div class="handle"></div><h2>I need to spend</h2><p>Let’s see if your current plan can make room without making a bill late.</p><div class="field"><label>How much do you need?</label><div class="input"><span>$</span><input id="needSpendAmount" inputmode="decimal" placeholder="0.00"></div></div><div class="field"><label>What’s this for? <span class="muted">(optional)</span></label><div class="input"><input id="needSpendNote" placeholder="Gas, groceries, medicine..."></div></div><button class="primary full" onclick="analyzeNeedSpend()">See my options →</button><div id="needSpendResult" class="need-result"></div><button class="ghost full" style="margin-top:10px" onclick="closeM(\'needSpendM\')">Cancel</button></div></div>');
 const patch=d.createElement('script');patch.textContent=`
P.prePaydayAdjustments=Array.isArray(P.prePaydayAdjustments)?P.prePaydayAdjustments:[];
function projectedAdjustmentForPayday(pd){if(!pd)return 0;let key=iso(pd);return (P.prePaydayAdjustments||[]).filter(x=>x.payday===key).reduce((sum,x)=>sum+n(x.amount),0)}
function effectiveProjectedSafe(plan,pd){return Math.max(0,n(plan.safeAdd)-projectedAdjustmentForPayday(pd))}
processScheduledPaycheckIfDue=function(){let pd=nextPayDates(1)[0];if(!pd||iso(pd)!==iso(today())||n(P.paycheck)<=0)return false;let key=paydayKey(pd);if(P.lastProcessedPayday===key)return false;let plan=paycheckPlan(pd,currentAvailable()),safeFromCheck=effectiveProjectedSafe(plan,pd);adjustAvailable(n(P.paycheck));P.s2sBalance=Math.max(0,n(P.s2sBalance)+safeFromCheck);P.lastProcessedPayday=key;P.s2sAnchor=suggestedCurrentS2S();P.s2sActivity=P.s2sActivity||[];P.s2sActivity.unshift({type:'add',amount:n(P.paycheck),desc:'Paycheck',date:new Date().toISOString(),mode:'paycheck',system:true,safeAdded:safeFromCheck});P.s2sActivity=P.s2sActivity.slice(0,50);localStorage.setItem(KEY,JSON.stringify(P));return true};
function billsDueBeforePayday(pd){if(!pd)return 0;let end=addDays(pd,-1),total=0;P.bills.forEach(b=>{occurrences(b,today(),end).forEach(()=>total+=n(b.amount))});return total}
function zeroStateData(){ensureS2S();let pd=nextPayDates(1)[0]||addDays(today(),freqDays()),plan=paycheckPlan(pd,currentAvailable()),projected=effectiveProjectedSafe(plan,pd),days=Math.max(0,Math.ceil((pd-today())/86400000));return {pd,plan,projected,days,active:n(P.s2sBalance)<=.001&&projected>0&&iso(pd)!==iso(today())}}
function openZeroPaycheckPreview(){let z=zeroStateData();if(!z.pd)return;balanceInfoTitle.textContent='Your '+z.pd.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' paycheck';balanceInfoBody.innerHTML='<p class="muted">Here’s how Safe2Spend projects your '+money(z.plan.income)+' paycheck.</p><div class="info-breakdown"><div class="plain-row"><span>Bills</span><strong>− '+money(z.plan.funding.total)+'</strong></div><div class="plain-row"><span>Everyday</span><strong>− '+money(z.plan.life)+'</strong></div><div class="plain-row"><span>Savings</span><strong>− '+money(z.plan.save)+'</strong></div>'+(projectedAdjustmentForPayday(z.pd)>0?'<div class="plain-row"><span>Already used before payday</span><strong>− '+money(projectedAdjustmentForPayday(z.pd))+'</strong></div>':'')+'<div class="plain-row"><span>Projected Safe2Spend</span><strong>'+money(z.projected)+'</strong></div></div>';balanceInfoM.classList.add('open')}
function openNeedSpend(){needSpendAmount.value='';needSpendNote.value='';needSpendResult.classList.remove('show');needSpendResult.innerHTML='';needSpendM.classList.add('open');setTimeout(()=>needSpendAmount.focus(),80)}
function needSpendCapacity(){let z=zeroStateData(),hard=billsDueBeforePayday(z.pd),availableAfterHard=Math.max(0,currentAvailable()-hard);return {z,hard,max:Math.max(0,Math.min(availableAfterHard,z.projected))}}
function analyzeNeedSpend(){let amt=n(needSpendAmount.value),c=needSpendCapacity();if(!amt)return;if(amt<=c.max){let after=Math.max(0,c.z.projected-amt);needSpendResult.innerHTML='<div class="need-option good"><h3>You can make this work.</h3><p>Use '+money(amt)+' today, and Safe2Spend will move '+money(amt)+' of the plan to your next paycheck.</p><div class="need-impact"><div><small>Today</small><strong>'+money(amt)+'</strong><br><small>available for this</small></div><div>→</div><div><small>Next paycheck</small><strong>'+money(c.z.projected)+' → '+money(after)+'</strong><br><small>projected Safe2Spend</small></div></div><div class="need-checks"><span>No bill due before payday is being used</span><span>Your paycheck plan absorbs the adjustment</span><span>'+money(after)+' projected Safe2Spend remains</span></div><button class="primary full" style="margin-top:14px" onclick="applyNeedSpend('+amt+')">Use '+money(amt)+' →</button></div>';needSpendResult.classList.add('show')}else{let best=c.max;needSpendResult.innerHTML='<div class="need-option"><h3>This needs a smaller adjustment.</h3><p>Safe2Spend can currently rearrange up to <strong>'+money(best)+'</strong> without borrowing from a bill due before payday or using more flexibility than the next paycheck creates.</p>'+(best>0?'<button class="primary full" onclick="needSpendAmount.value=\''+best+'\';analyzeNeedSpend()">Try '+money(best)+' →</button>':'<p><strong>No current balance can be safely rearranged before payday.</strong></p>')+'</div>';needSpendResult.classList.add('show')}}
function applyNeedSpend(amt){amt=n(amt);let c=needSpendCapacity();amt=Math.min(amt,c.max,currentAvailable());if(!amt)return;let desc=needSpendNote.value.trim()||'Spent before payday';adjustAvailable(-amt);P.prePaydayAdjustments.unshift({payday:iso(c.z.pd),amount:amt,desc,date:new Date().toISOString()});P.prePaydayAdjustments=P.prePaydayAdjustments.slice(0,50);P.s2sActivity=P.s2sActivity||[];P.s2sActivity.unshift({type:'spend',amount:amt,desc,date:new Date().toISOString(),mode:'prepayday'});P.s2sActivity=P.s2sActivity.slice(0,50);P.s2sAnchor=suggestedCurrentS2S();localStorage.setItem(KEY,JSON.stringify(P));closeM('needSpendM');render()}
const _baseOpenS2SAction=openS2SAction;openS2SAction=function(type){if(type==='spend'&&zeroStateData().active)return openNeedSpend();return _baseOpenS2SAction(type)};
const _baseShowMoneyJob=showMoneyJob;showMoneyJob=function(job){if(job!=='yours')return _baseShowMoneyJob(job);let pd=nextPayDates(1)[0]||addDays(today(),freqDays()),plan=paycheckPlan(pd,currentAvailable()),projected=effectiveProjectedSafe(plan,pd);if(window.moneyJobExplain)moneyJobExplain.textContent=(isPaydayToday()?'This paycheck adds ':'This paycheck is projected to add ')+money(projected)+' to Safe2Spend after bills, everyday spending and savings get their jobs first.'};
const _baseRenderS2S=renderS2S;renderS2S=function(){_baseRenderS2S();let z=zeroStateData(),avail=currentAvailable(),np=z.pd,days=np?Math.max(1,Math.ceil((np-today())/86400000)):1;normalHeroCopy.style.display=z.active?'none':'';betweenPill.classList.toggle('show',z.active);betweenCopy.classList.toggle('show',z.active);zeroPreview.classList.toggle('show',z.active);untilPaydayCard.classList.toggle('show',z.active);if(z.active){betweenPill.textContent=avail>0?'✓ Your current '+money(avail)+' is already accounted for.':'✓ Your current plan is fully allocated.';betweenCopy.innerHTML='You’re between paychecks. <strong>If you don’t need anything before then, you’re all set.</strong>';currentS2SSub.style.display='none';zeroPreviewWhen.textContent='NEXT PAYCHECK · '+(z.days===1?'TOMORROW':z.pd.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}).toUpperCase());zeroPreviewIncome.textContent=money(z.plan.income);zeroPreviewSafe.textContent=money(z.projected);untilPaydayCopy.innerHTML=(avail>0?'Your current balance is already assigned to your plan.':'There is no flexible Safe2Spend right now.')+' If you need to spend before '+(z.days===1?'tomorrow':z.pd.toLocaleDateString(undefined,{month:'short',day:'numeric'}))+', Safe2Spend can check whether the plan has room to adjust.'}else{currentS2SSub.style.display='';currentS2SSub.textContent='Want to pace it? About '+money(P.s2sBalance/days)+'/day until payday.'}};
const _baseRender=render;render=function(){_baseRender();let pd=nextPayDates(1)[0]||addDays(today(),freqDays()),plan=paycheckPlan(pd,currentAvailable()),projected=effectiveProjectedSafe(plan,pd),total=Math.max(1,n(plan.income));if(window.nextSafe)nextSafe.textContent=money(projected);if(window.paydaySafe)paydaySafe.textContent=money(projected);if(window.segYours)setSeg(segYours,projected,total,isPaydayToday()?'Safe2Spend':'Projected');showMoneyJob('yours');if(window.advisorText)advisorText.textContent=advisor(Object.assign({},plan,{safeAdd:projected}))};
render();localStorage.setItem(KEY,JSON.stringify(P));
`;d.body.appendChild(patch);
}
stage.addEventListener('load',()=>setTimeout(installZeroState,80));setTimeout(installZeroState,150);
</script></body></html>
