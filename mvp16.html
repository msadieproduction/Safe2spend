<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173C35"><title>Safe2Spend</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7f5}iframe{border:0;width:100%;height:100%;display:block}</style></head>
<body><iframe id="app" src="app.html" title="Safe2Spend"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
 const d=frame.contentDocument,w=frame.contentWindow;
 if(!d||!w||d.getElementById('mvp16HomeStyle'))return;
 const style=d.createElement('style');style.id='mvp16HomeStyle';style.textContent=`
.s2s-bubble{background:radial-gradient(circle at 82% 13%,rgba(122,222,174,.34) 0 14%,transparent 15%),linear-gradient(145deg,#165844 0%,#20946a 58%,#48ba8a 100%)!important;border-radius:32px!important;padding:24px 22px 20px!important}.s2s-bubble .s2s-value{font-size:72px!important;margin:12px 0 8px!important}.s2s-bubble .sub{margin-top:14px;font-size:16px}.s2s-pace{color:#d8eee5;font-size:12px;margin-top:7px}.home-activity{margin-top:14px;border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.10);border-radius:16px;overflow:hidden}.home-activity-toggle{width:100%;border:0;background:transparent;color:#fff;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:900;text-align:left}.home-activity-count{color:#d8eee5;font-weight:700}.home-activity-panel{display:none;max-height:190px;overflow:auto;border-top:1px solid rgba(255,255,255,.14);padding:0 12px}.home-activity-panel.open{display:block}.home-activity-panel .activity-item{border-bottom-color:rgba(255,255,255,.12);color:#fff}.home-activity-panel .activity-item small{color:#d8eee5}.balance-stack{display:grid;grid-template-columns:1fr;gap:10px;margin-top:13px}.balance-box{border:1px solid var(--line);border-radius:19px;padding:15px;background:linear-gradient(145deg,#fff,#f9fcfa)}.balance-box>small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:900}.balance-box>strong{display:block;font-size:31px;margin-top:4px}.balance-updated{font-size:12px;color:var(--muted);margin-top:4px}.balance-bar{height:13px;border-radius:999px;background:#e8efeb;overflow:hidden;display:flex;margin:14px 0 8px}.balance-seg{border:0;padding:0;min-height:13px;border-radius:0;cursor:pointer}.balance-seg.accounted{background:#78a9e8}.balance-seg.flexible{background:linear-gradient(90deg,#23976d,#55be91)}.balance-legend{display:flex;justify-content:space-between;gap:12px;font-size:12px}.balance-legend button{border:0;background:transparent;padding:4px 0;text-align:left;color:var(--muted);cursor:pointer}.balance-legend button:last-child{text-align:right}.balance-legend strong{display:block;color:var(--ink);font-size:20px}.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.legend-dot.blue{background:#78a9e8}.legend-dot.green{background:#2b9b70}.savings-goalbar{height:9px;border-radius:999px;background:#edf2ef;overflow:hidden;margin-top:14px}.savings-goalbar>div{height:100%;background:linear-gradient(90deg,#64c79b,#2c9c72);border-radius:999px}.savings-goalfoot{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-size:12px;color:var(--muted)}.savings-goalfoot strong{color:var(--ink)}.info-breakdown{display:grid;gap:9px;margin:14px 0}.info-breakdown .plain-row{padding:11px 12px;border-radius:13px;background:#f5f8f7;border:0}.income-choice-wrap{display:none;margin:10px 0}.income-choice{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:13px;margin:7px 0;text-align:left}.income-choice.active{border-color:var(--green);background:var(--green-soft)}.income-choice strong,.income-choice small{display:block}.income-choice small{color:var(--muted);margin-top:3px;line-height:1.35}.income-preview{display:none;margin:10px 0;padding:12px 13px;border-radius:15px;background:#eef8f3;border:1px solid #d6eadf;font-size:13px;line-height:1.45}.income-preview.show{display:block}@media(max-width:410px){.s2s-bubble .s2s-value{font-size:60px!important}.balance-legend strong{font-size:18px}}
`;d.head.appendChild(style);
 const oldHome=d.getElementById('home');
 const payday=oldHome.querySelector('#paydayCard')?.outerHTML||'';
 const advisor=oldHome.querySelector('#advisorText')?.closest('.card')?.outerHTML||'';
 const planner=[...oldHome.querySelectorAll('.card')].find(c=>c.textContent.includes('See what’s coming'))?.outerHTML||'';
 oldHome.innerHTML=`<div class="card s2s-bubble"><div class="label">Safe2Spend right now</div><div class="s2s-value" id="currentS2S">$0</div><div class="sub">Spend it, save some, or let it roll forward. <strong>It’s your money.</strong></div><div class="s2s-pace" id="currentS2SSub">Want to pace it? About $0/day until payday.</div><div class="s2s-actions"><button onclick="openS2SAction('spend')">− I spent</button><button onclick="openS2SAction('add')">+ Money in</button><button onclick="openS2SAction('save')">↗ Save</button></div><div class="home-activity"><button class="home-activity-toggle" onclick="toggleHomeActivity()"><span>Recent activity <span id="homeActivityCount" class="home-activity-count"></span></span><span id="homeActivityChevron">⌄</span></button><div id="s2sActivity" class="home-activity-panel"></div></div></div><div class="card compact soft-card"><div class="section"><h3>Current balances</h3></div><div class="balance-stack"><div class="balance-box"><small>Available balance</small><strong id="dashChecking">$0</strong><div class="balance-updated">Last updated today</div><div class="balance-bar"><button id="accountedBar" class="balance-seg accounted" onclick="openBalanceInfo('accounted')" aria-label="See accounted-for breakdown"></button><button id="safeBar" class="balance-seg flexible" onclick="openBalanceInfo('s2s')" aria-label="Learn about Safe2Spend"></button></div><div class="balance-legend"><button onclick="openBalanceInfo('accounted')"><span><i class="legend-dot blue"></i>Accounted for</span><strong id="accountedLegend">$0</strong></button><button onclick="openBalanceInfo('s2s')"><span><i class="legend-dot green"></i>Safe2Spend</span><strong id="safeLegend">$0</strong></button></div></div><div class="balance-box"><small>Savings</small><strong id="dashSavings">$0</strong><div class="balance-updated" id="dashSavingsGoal">Savings</div><div class="savings-goalbar"><div id="dashSavingsProgress" style="width:0%"></div></div><div class="savings-goalfoot"><span id="dashSavingsSaved">$0 saved</span><strong id="dashSavingsGoalAmt">No goal yet</strong></div></div></div></div>${payday}${advisor}${planner}`;
 const noteField=d.getElementById('s2sDesc')?.closest('.field');
 if(noteField&&!d.getElementById('incomeChoiceWrap'))noteField.insertAdjacentHTML('afterend',`<div id="incomeChoiceWrap" class="income-choice-wrap"><button class="income-choice active" data-income-mode="decide" onclick="chooseIncomeMode('decide',this)"><strong>Let Safe2Spend decide — Recommended</strong><small>Protect any uncovered part of the current plan first. Anything left becomes Safe2Spend.</small></button><button class="income-choice" data-income-mode="flex" onclick="chooseIncomeMode('flex',this)"><strong>Add to Safe2Spend</strong><small>Treat all of this new money as flexible.</small></button><button class="income-choice" data-income-mode="save" onclick="chooseIncomeMode('save',this)"><strong>Move it to savings</strong><small>Add this new money directly to savings instead.</small></button></div><div id="incomePreview" class="income-preview"></div>`);
 if(!d.getElementById('balanceInfoM'))d.body.insertAdjacentHTML('beforeend',`<div id="balanceInfoM" class="modal"><div class="sheet"><div class="handle"></div><h2 id="balanceInfoTitle"></h2><div id="balanceInfoBody"></div><button class="primary full" onclick="closeM('balanceInfoM')">Got it</button></div></div>`);
 const patch=d.createElement('script');patch.textContent=`
let currentIncomeMode='decide';
function currentRequiredProtection(){let f=currentUpcomingFunding();return {bills:Math.max(0,n(f.total)),everyday:Math.max(0,lifeTotal()),savings:Math.max(0,n(P.savePerPaycheck))}}
function requiredProtectionTotal(){let r=currentRequiredProtection();return r.bills+r.everyday+r.savings}
function currentAvailable(){return Math.max(0,n(P.checking)+n(P.cash))}
function suggestedCurrentS2S(){return Math.max(0,currentAvailable()-requiredProtectionTotal())}
function ensureS2S(){P.s2sActivity=P.s2sActivity||[];let target=suggestedCurrentS2S();if(P.s2sAnchor===null||P.s2sAnchor===undefined||Number.isNaN(Number(P.s2sAnchor))){P.s2sAnchor=target;P.s2sBalance=target}else{let delta=target-P.s2sAnchor;if(Math.abs(delta)>.001){P.s2sBalance=Math.max(0,n(P.s2sBalance)+delta);P.s2sAnchor=target}if(P.s2sBalance===null||P.s2sBalance===undefined||Number.isNaN(Number(P.s2sBalance)))P.s2sBalance=target}P.s2sBalance=Math.max(0,Math.min(currentAvailable(),n(P.s2sBalance)))}
function currentAccounted(){ensureS2S();return Math.max(0,Math.min(currentAvailable(),currentAvailable()-n(P.s2sBalance)))}
function currentProtectionGap(){return Math.max(0,requiredProtectionTotal()-currentAccounted())}
function accountedBreakdown(){let r=currentRequiredProtection(),left=currentAccounted(),bills=Math.min(r.bills,left);left-=bills;let everyday=Math.min(r.everyday,left);left-=everyday;let savings=Math.min(r.savings,left);left-=savings;return {bills,everyday,savings,other:Math.max(0,left),total:currentAccounted()}}
function adjustAvailable(delta){delta=n(delta);if(delta>=0){P.checking=n(P.checking)+delta;return}let take=Math.min(n(P.checking),-delta);P.checking-=take;let left=(-delta)-take;if(left>0)P.cash=Math.max(0,n(P.cash)-left)}
function paydayKey(pd){return pd?iso(pd)+'|'+String(n(P.paycheck)):''}
function processScheduledPaycheckIfDue(){let pd=nextPayDates(1)[0];if(!pd||iso(pd)!==iso(today())||n(P.paycheck)<=0)return false;let key=paydayKey(pd);if(P.lastProcessedPayday===key)return false;adjustAvailable(n(P.paycheck));P.lastProcessedPayday=key;P.s2sAnchor=null;P.s2sActivity=P.s2sActivity||[];P.s2sActivity.unshift({type:'add',amount:n(P.paycheck),desc:'Paycheck',date:new Date().toISOString(),mode:'paycheck',system:true});P.s2sActivity=P.s2sActivity.slice(0,50);localStorage.setItem(KEY,JSON.stringify(P));return true}
function chooseIncomeMode(mode,btn){currentIncomeMode=mode;document.querySelectorAll('#incomeChoiceWrap .income-choice').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');previewIncomeDecision()}
function previewIncomeDecision(){if(currentS2SAction!=='add'||!window.incomePreview)return;let amt=n(s2sAmount.value);if(!amt){incomePreview.classList.remove('show');return}let gap=currentProtectionGap(),html='';if(currentIncomeMode==='decide'){let repair=Math.min(amt,gap),flex=Math.max(0,amt-repair);html=gap>0?'<strong>Safe2Spend would split this:</strong><br>'+money(repair)+' covers the current plan gap.<br><strong>'+money(flex)+'</strong> becomes additional Safe2Spend.':'<strong>Your current plan is already covered.</strong><br>All '+money(amt)+' becomes additional Safe2Spend.'}else if(currentIncomeMode==='flex')html='All <strong>'+money(amt)+'</strong> becomes additional Safe2Spend.';else html='All <strong>'+money(amt)+'</strong> moves to Savings.';incomePreview.innerHTML=html;incomePreview.classList.add('show')}
openS2SAction=function(type){currentS2SAction=type;s2sAmount.value='';s2sDesc.value='';incomeChoiceWrap.style.display='none';incomePreview.classList.remove('show');if(type==='spend'){s2sActionTitle.textContent='What did you spend?';s2sActionCopy.textContent='This reduces both Available Balance and Safe2Spend. Accounted-for money stays protected.';s2sAmountLabel.textContent='Amount spent';s2sDesc.placeholder='Lunch, gas, groceries...';s2sActionButton.textContent='Subtract'}if(type==='add'){s2sActionTitle.textContent='Money came in?';s2sActionCopy.textContent='Tell Safe2Spend what came in and what you want it to do.';s2sAmountLabel.textContent='Amount received';s2sDesc.placeholder='Refund, side gig, gift...';s2sActionButton.textContent='Add money';incomeChoiceWrap.style.display='block';chooseIncomeMode('decide',document.querySelector('[data-income-mode="decide"]'))}if(type==='save'){s2sActionTitle.textContent='Move money to savings';s2sActionCopy.textContent='This moves money out of Available Balance and Safe2Spend and into Savings.';s2sAmountLabel.textContent='Amount to save';s2sDesc.placeholder='Emergency fund, trip, future goal...';s2sActionButton.textContent='Move to savings'}s2sM.classList.add('open')};
applyS2SAction=function(){ensureS2S();let amt=n(s2sAmount.value);if(!amt)return;let desc=s2sDesc.value.trim();if(currentS2SAction==='spend'){amt=Math.min(amt,P.s2sBalance,currentAvailable());if(!amt)return;adjustAvailable(-amt);P.s2sBalance=Math.max(0,P.s2sBalance-amt);P.s2sActivity.unshift({type:'spend',amount:amt,desc:desc||'Spent',date:new Date().toISOString()})}else if(currentS2SAction==='save'){amt=Math.min(amt,P.s2sBalance,currentAvailable());if(!amt)return;adjustAvailable(-amt);P.savings=n(P.savings)+amt;P.s2sBalance=Math.max(0,P.s2sBalance-amt);P.s2sActivity.unshift({type:'save',amount:amt,desc:desc||'Moved to savings',date:new Date().toISOString()})}else if(currentIncomeMode==='save'){P.savings=n(P.savings)+amt;P.s2sActivity.unshift({type:'save',amount:amt,desc:desc||'Money moved to savings',date:new Date().toISOString()})}else{let gap=currentProtectionGap();adjustAvailable(amt);if(currentIncomeMode==='flex')P.s2sBalance=n(P.s2sBalance)+amt;else{let repair=Math.min(amt,gap),flex=Math.max(0,amt-repair);P.s2sBalance=n(P.s2sBalance)+flex}P.s2sActivity.unshift({type:'add',amount:amt,desc:desc||'Money in',date:new Date().toISOString(),mode:currentIncomeMode})}P.s2sAnchor=suggestedCurrentS2S();P.s2sActivity=P.s2sActivity.slice(0,50);localStorage.setItem(KEY,JSON.stringify(P));closeM('s2sM');render()};
function toggleHomeActivity(){s2sActivity.classList.toggle('open');homeActivityChevron.textContent=s2sActivity.classList.contains('open')?'⌃':'⌄'}
function openBalanceInfo(kind){ensureS2S();if(kind==='accounted'){let b=accountedBreakdown();balanceInfoTitle.textContent=money(b.total)+' Accounted for';balanceInfoBody.innerHTML='<p class="muted">Here’s exactly what this part of your Available Balance is covering.</p><div class="info-breakdown"><div class="plain-row"><span>Bills</span><strong>'+money(b.bills)+'</strong></div><div class="plain-row"><span>Everyday</span><strong>'+money(b.everyday)+'</strong></div><div class="plain-row"><span>Savings plan</span><strong>'+money(b.savings)+'</strong></div>'+(b.other>0?'<div class="plain-row"><span>Other planned</span><strong>'+money(b.other)+'</strong></div>':'')+'<div class="plain-row"><span>Total accounted for</span><strong>'+money(b.total)+'</strong></div></div>'}else{balanceInfoTitle.textContent=money(P.s2sBalance)+' Safe2Spend';balanceInfoBody.innerHTML='<p class="muted">This is what remains after the <strong>'+money(currentAccounted())+' accounted for</strong> in your current plan.</p><p><strong>It’s flexible.</strong> Spend it, save it, or let it roll forward.</p>'}balanceInfoM.classList.add('open')}
renderS2S=function(){ensureS2S();currentS2S.textContent=money(P.s2sBalance);let np=nextPayDates(1)[0],days=np?Math.max(1,Math.ceil((np-today())/86400000)):1;currentS2SSub.textContent='Want to pace it? About '+money(P.s2sBalance/days)+'/day until payday.';homeActivityCount.textContent=P.s2sActivity.length?'· '+P.s2sActivity.length:'';if(!P.s2sActivity.length){s2sActivity.innerHTML='<div class="activity-item"><div><strong>No activity yet</strong><br><small>Your Safe2Spend updates will appear here.</small></div></div>';return}s2sActivity.innerHTML=P.s2sActivity.slice(0,30).map(a=>{let sign=a.type==='add'?'+':a.type==='save'?'↗':'−',label=a.mode==='paycheck'?'Paycheck':a.type==='save'?'Saved':a.type==='add'?'Money in':'Spent',dt=new Date(a.date).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});return '<div class="activity-item"><div><strong>'+esc(a.desc||label)+'</strong><br><small>'+label+' • '+dt+'</small></div><strong>'+sign+' '+money(a.amount)+'</strong></div>'}).join('')};
render=function(){processScheduledPaycheckIfDue();ensureS2S();let pd=nextPayDates(1)[0]||addDays(today(),freqDays()),plan=paycheckPlan(pd,P.checking+P.cash),total=Math.max(1,n(plan.income));renderS2S();let available=currentAvailable(),accounted=currentAccounted(),safe=Math.min(available,n(P.s2sBalance)),denom=Math.max(1,available);dashChecking.textContent=money(available);dashSavings.textContent=money(P.savings);accountedLegend.textContent=money(accounted);safeLegend.textContent=money(safe);accountedBar.style.width=(accounted/denom*100)+'%';safeBar.style.width=(safe/denom*100)+'%';dashSavingsGoal.textContent=P.goalName||'Savings';dashSavingsSaved.textContent=money(P.savings)+' saved';dashSavingsGoalAmt.textContent=n(P.goalAmount)?money(P.goalAmount)+' goal':'No goal yet';dashSavingsProgress.style.width=(n(P.goalAmount)?Math.min(100,n(P.savings)/n(P.goalAmount)*100):0)+'%';let payday=isPaydayToday();paydayKicker.textContent=payday?'PAYDAY':'NEXT PAYCHECK';paydayTitle.textContent=payday?'You got paid. Here’s the move.':pd.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});paydayIntro.textContent=payday?money(plan.income)+' was added to Available Balance. Here’s how this paycheck is split.':money(plan.income)+' is expected. Here is the simple split I’d use.';paydayCard.classList.toggle('payday-celebrate',payday);let nextSafeLabel=nextSafe.closest('button')?.querySelector('small');if(nextSafeLabel)nextSafeLabel.textContent=payday?'Safe2Spend from paycheck':'Projected Safe2Spend';let safeRowLabel=paydaySafe.closest('.safe-row')?.querySelector('small.muted');if(safeRowLabel)safeRowLabel.textContent=payday?'After everything important':'Projected after everything important';nextIncome.textContent='+ '+money(plan.income);nextBills.textContent=money(plan.funding.total);nextLife.textContent=money(plan.life);nextSaving.textContent=money(plan.save);nextSafe.textContent=money(plan.safeAdd);paydaySafe.textContent=money(plan.safeAdd);paydayUntil.textContent='until '+(nextPayDates(2)[1]?nextPayDates(2)[1].toLocaleDateString(undefined,{month:'short',day:'numeric'}):'next payday');setSeg(segBills,plan.funding.total,total,'Bills');setSeg(segLife,plan.life,total,'Everyday');setSeg(segSave,plan.save,total,'Savings');setSeg(segYours,plan.safeAdd,total,payday?'Safe2Spend':'Projected');showMoneyJob('yours');advisorText.textContent=advisor(plan);renderFunding(plan.funding);renderForecast();renderSetup();renderWeeklyOutlook();freqLabel.textContent=freqName()};
s2sAmount.addEventListener('input',previewIncomeDecision);if(P.lastProcessedPayday===undefined)P.lastProcessedPayday=null;P.s2sAnchor=null;render();localStorage.setItem(KEY,JSON.stringify(P));
`;d.body.appendChild(patch);
});
</script></body></html>
