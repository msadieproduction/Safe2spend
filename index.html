<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06110e">
<title>Safe2Spend</title>
<style>
:root{--ink:#f7fbf9;--muted:#c8d3ce;--green:#35e29c;--green2:#13c98b;--deep:#06110e}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#030807;color:var(--ink);overflow:hidden}
.splash{position:relative;min-height:100dvh;display:grid;place-items:center;padding:24px;isolation:isolate;background:radial-gradient(circle at 50% 45%,rgba(20,128,86,.23),transparent 24%),linear-gradient(160deg,#06110e 0%,#020504 62%,#06100d 100%)}
.splash:before,.splash:after{content:"";position:absolute;border-radius:50%;z-index:-1;filter:drop-shadow(0 0 16px rgba(53,226,156,.24))}
.splash:before{width:60vmax;height:60vmax;left:-34vmax;top:-40vmax;background:radial-gradient(circle at 65% 65%,rgba(44,160,112,.30),rgba(8,34,27,.96) 58%,#07110e 74%);border:1px solid rgba(53,226,156,.52);box-shadow:inset -25px -25px 70px rgba(53,226,156,.08)}
.splash:after{width:65vmax;height:65vmax;right:-45vmax;bottom:-42vmax;background:radial-gradient(circle at 28% 24%,rgba(37,126,91,.34),rgba(7,28,22,.96) 58%,#06100d 74%);border:1px solid rgba(53,226,156,.45);box-shadow:inset 25px 25px 70px rgba(53,226,156,.07)}
.center{width:min(520px,100%);text-align:center;transform:translateY(-2vh);animation:enter .7s cubic-bezier(.2,.8,.2,1) both}
.mark{width:112px;height:112px;margin:0 auto 24px;position:relative;filter:drop-shadow(0 18px 28px rgba(26,218,145,.24))}
.mark span{position:absolute;left:17px;right:17px;height:34px;border-radius:12px 28px 12px 28px;background:linear-gradient(135deg,#8df7c4 0%,#2ce29a 45%,#0da36f 100%);transform:skewY(-28deg);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.mark span:first-child{top:21px}.mark span:last-child{bottom:21px;transform:skewY(28deg)}
h1{font-size:clamp(46px,12vw,72px);line-height:.95;letter-spacing:-.055em;margin:0;font-weight:900}h1 .two{color:#35e29c}
p{margin:18px 0 34px;color:var(--muted);font-size:clamp(18px,4.7vw,25px);letter-spacing:.01em}
.start{appearance:none;border:0;cursor:pointer;min-width:min(390px,88vw);padding:18px 30px;border-radius:999px;background:linear-gradient(90deg,#7af0b8 0%,#31dfa0 45%,#12c98b 100%);color:#062319;font-size:21px;font-weight:900;box-shadow:0 0 0 1px rgba(158,255,210,.18),0 12px 34px rgba(20,207,139,.27),0 0 36px rgba(20,207,139,.12);transition:transform .18s ease,box-shadow .18s ease}
.start:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(158,255,210,.24),0 17px 40px rgba(20,207,139,.32),0 0 46px rgba(20,207,139,.16)}.start:active{transform:scale(.985)}.start .arrow{display:inline-block;margin-left:8px;transition:transform .18s ease}.start:hover .arrow{transform:translateX(4px)}
@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:translateY(-2vh) scale(1)}}
@media(max-width:480px){.mark{width:92px;height:92px;margin-bottom:22px}.mark span{left:14px;right:14px;height:29px}.mark span:first-child{top:17px}.mark span:last-child{bottom:17px}p{margin-top:15px;margin-bottom:30px}.start{font-size:19px;padding:17px 26px}}
</style>
</head>
<body>
<main class="splash"><section class="center" aria-labelledby="brand-title"><div class="mark" aria-hidden="true"><span></span><span></span></div><h1 id="brand-title">Safe<span class="two">2</span>Spend</h1><p>Plan clearly. Spend confidently.</p><button class="start" type="button" onclick="location.href='mvp16-v2.html?v=1604'">Start <span class="arrow">→</span></button></section></main>
</body>
</html>
