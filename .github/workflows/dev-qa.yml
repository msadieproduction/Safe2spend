name: Safe2Spend Dev QA
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run canonical engine and architecture QA
        run: node qa-core.js
