const fixedProcess=`function processScheduledPaycheckIfDue(){let pd=nextPayDates(1)[0];if(!pd||iso(pd)!==iso(today())||n(P.paycheck)<=0)return false;let day=iso(pd),last=String(P.lastProcessedPayday||'');if(last===day||last.indexOf(day+'|')===0)return false;let stored={};try{stored=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}let beforeSafe=(stored.s2sBalance!==null&&stored.s2sBalance!==undefined&&!Number.isNaN(Number(stored.s2sBalance)))?Math.max(0,n(stored.s2sBalance)):Math.max(0,currentAvailable()-requiredProtectionTotal());let plan=paycheckPlan(pd,currentAvailable()),adj=(P.prePaydayAdjustments||[]).filter(x=>x.payday===day).reduce((sum,x)=>sum+n(x.amount),0),safeFromPaycheck=Math.max(0,n(plan.safeAdd)-adj);adjustAvailable(n(P.paycheck));P.s2sBalance=Math.max(0,beforeSafe+safeFromPaycheck);P.s2sAnchor=suggestedCurrentS2S();P.lastProcessedPayday=day;P.s2sActivity=P.s2sActivity||[];P.s2sActivity.unshift({type:'add',amount:n(P.paycheck),desc:'Paycheck',date:new Date().toISOString(),mode:'paycheck',system:true,safeAdded:safeFromPaycheck});P.s2sActivity=P.s2sActivity.slice(0,50);localStorage.setItem(KEY,JSON.stringify(P));return true}`;

function recoverFreshState(w,d){try{const key=w.KEY||'safe2spend_mvp14';const raw=w.localStorage.getItem(key);if(!raw)return false;const p=JSON.parse(raw||'{}');const num=v=>Math.max(0,Number(String(v||'').replace(/[$,\s]/g,''))||0);const life=p.life||{};const configured=num(p.paycheck)>0||!!p.nextPayday||(Array.isArray(p.bills)&&p.bills.length>0)||num(p.checking)>0||num(p.cash)>0||num(p.savings)>0||num(life.food)+num(life.gas)+num(life.other)>0||num(p.savePerPaycheck)>0||!!p.goalName;if(!configured){w.localStorage.removeItem(key);const ob=d.getElementById('onboard');if(ob)ob.classList.remove('hide');return true}}catch(e){console.error('[Safe2Spend fresh-state recovery]',e)}return false;}
